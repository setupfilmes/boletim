name: Manter Supabase acordado

# O plano grátis do Supabase pausa o projeto após 7 dias sem uso (o app segue offline, mas para de sincronizar).
# A cada 3 dias chama a função public.ping() com a chave pública do app (a mesma do public/config.js).
on:
  schedule:
    - cron: '17 11 */3 * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Ping no banco
        run: |
          URL=$(grep -o "SUPABASE_URL: *'[^']*'" public/config.js | cut -d"'" -f2)
          KEY=$(grep -o "SUPABASE_ANON_KEY: *'[^']*'" public/config.js | cut -d"'" -f2)
          curl -sS --fail-with-body -X POST "$URL/rest/v1/rpc/ping" \
            -H "apikey: $KEY" -H "Content-Type: application/json" -d '{}'
